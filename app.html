    // Video Selection & Filmstrip Generator
    window.handleFileChange = async (event) => {

      tempVid.preload = 'metadata';
      tempVid.src = videoUrl;
      tempVid.muted = true;

      tempVid.onloadedmetadata = async () => {

        startSlider.max = videoDuration;
        endSlider.max = videoDuration;
        startSlider.value = 0;
        endSlider.value = trimEndSec;

        updateTrimmerUI();
        await generateVisualFilmstrip(file, videoDuration);
      };
    };

    async function generateVisualFilmstrip(file, duration) {
      const strip = document.getElementById('videoThumbnailsStrip');
      strip.innerHTML = '';

      const frameCount = 12;
      const canvas = document.createElement('canvas');
      canvas.width = 80;
      canvas.height = 56;
      const ctx = canvas.getContext('2d');

      const v = document.createElement('video');
      v.src = URL.createObjectURL(file);
      v.muted = true;
      v.playsInline = true;

      for (let i = 0; i < frameCount; i++) {
        const time = (duration / frameCount) * i;
        await new Promise((resolve) => {
          v.currentTime = time;
          v.onseeked = () => {
            ctx.drawImage(v, 0, 0, canvas.width, canvas.height);
            const img = document.createElement('img');
            img.src = canvas.toDataURL('image/jpeg', 0.6);
            img.className = 'h-full flex-1 object-cover border-r border-[#181820]/40';
            strip.appendChild(img);
            resolve();
          };
        });
      }
    }

    window.onSliderRangeChange = (type) => {
      const startSlider = document.getElementById('rangeStartInput');
      const endSlider = document.getElementById('rangeEndInput');

      let s = parseInt(startSlider.value, 10);
      let e = parseInt(endSlider.value, 10);

      if (type === 'start' && s >= e) {
        s = Math.max(0, e - 30);
        startSlider.value = s;
      }
      if (type === 'end' && e <= s) {
        e = Math.min(videoDuration, s + 30);
        endSlider.value = e;
      }

      trimStartSec = s;
      trimEndSec = e;

      const previewVid = document.getElementById('trimmerPreviewVideo');
      if (previewVid) previewVid.currentTime = trimStartSec;

      updateTrimmerUI();
    };

    window.updateShortsSelectionCount = () => {

      document.getElementById('shortsCountBadge').innerText = `${count} Shorts x 30s`;
    };

    function updateTrimmerUI() {
      const startPercent = (trimStartSec / videoDuration) * 100;
      const endPercent = (trimEndSec / videoDuration) * 100;
      const widthPercent = Math.max(2, endPercent - startPercent);

      const box = document.getElementById('trimSelectionBox');
      const leftDim = document.getElementById('leftDimmer');
      const rightDim = document.getElementById('rightDimmer');

      if (box) {
        box.style.left = `${startPercent}%`;
        box.style.width = `${widthPercent}%`;
      }
      if (leftDim) leftDim.style.width = `${startPercent}%`;
      if (rightDim) rightDim.style.width = `${100 - endPercent}%`;

      document.getElementById('startSecLabel').innerText = `${trimStartSec}s (${Math.floor(trimStartSec / 60)}m ${trimStartSec % 60}s)`;
      document.getElementById('endSecLabel').innerText = `${trimEndSec}s (${Math.floor(trimEndSec / 60)}m ${trimEndSec % 60}s)`;

      const span = Math.max(30, trimEndSec - trimStartSec);
      document.getElementById('rangeSummaryText').innerText = `Selected Range: ${trimStartSec}s to ${trimEndSec}s (${span}s total)`;
    }

    // ROBUST SLICER WITH AUDIO PIPELINE & BODY TRACKING (NO POPUPS)
    function sliceDirectVideoSegment(videoSource, clipNumber, startTime) {
      return new Promise(async (resolve) => {
        const vid = document.createElement('video');
        vid.muted = false;
        vid.playsInline = true;
        vid.crossOrigin = "anonymous";
        vid.src = URL.createObjectURL(videoSource);

        let currentTargetX = 0.5;
        let smoothedTargetX = 0.5;
        let frameCounter = 0;

        let poseDetector = null;
        if (window.Pose) {
          poseDetector = new window.Pose({
            locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
          });
          poseDetector.setOptions({
            modelComplexity: 0,
            smoothLandmarks: true,
            minDetectionConfidence: 0.3,
            minTrackingConfidence: 0.3
          });

          poseDetector.onResults((results) => {
            if (results.poseLandmarks && results.poseLandmarks.length > 0) {
              const nose = results.poseLandmarks[0];
              const leftHip = results.poseLandmarks[23];
              const rightHip = results.poseLandmarks[24];
              
              if (nose && leftHip && rightHip) {
                const hipCenter = (leftHip.x + rightHip.x) / 2;
                currentTargetX = (nose.x * 0.3) + (hipCenter * 0.7);
              } else if (leftHip && rightHip) {
                currentTargetX = (leftHip.x + rightHip.x) / 2;
              } else if (nose) {
                currentTargetX = nose.x;
              }
            }
          });
        }

        const CLIP_DURATION = 30; // EXACT 30 SECONDS

        await new Promise((res) => {
          vid.onloadedmetadata = () => {
            vid.currentTime = Math.min(startTime, Math.max(0, vid.duration - CLIP_DURATION));
            res();
          };
        });

        await new Promise((res) => {
          vid.onseeked = () => res();
        });

        const canvas = document.createElement('canvas');
        canvas.width = 540;
        canvas.height = 960; // 9:16 vertical ratio
        const ctx = canvas.getContext('2d', { alpha: false });

        const canvasStream = canvas.captureStream(20);
        const videoTrack = canvasStream.getVideoTracks()[0];

        // Web Audio API Stream Capture for 100% Reliable Sound
        let audioTrack = null;
        try {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          const audioCtx = new AudioContextClass();
          if (audioCtx.state === 'suspended') {
            await audioCtx.resume();
          }
          const sourceNode = audioCtx.createMediaElementSource(vid);
          const dest = audioCtx.createMediaStreamDestination();
          sourceNode.connect(dest);
          sourceNode.connect(audioCtx.destination);
          if (dest.stream.getAudioTracks().length > 0) {
            audioTrack = dest.stream.getAudioTracks()[0];
          }
        } catch (err) {
          try {
            const vidStream = vid.captureStream ? vid.captureStream() : vid.mozCaptureStream();
            if (vidStream && vidStream.getAudioTracks().length > 0) {
              audioTrack = vidStream.getAudioTracks()[0];
            }
          } catch (e) {}
        }

        const tracks = [videoTrack];
        if (audioTrack) {
          tracks.push(audioTrack);
        }
        const combinedStream = new MediaStream(tracks);

        let rec;
        try { 
          rec = new MediaRecorder(combinedStream, { mimeType: 'video/webm;codecs=vp8,opus', videoBitsPerSecond: 2000000 }); 
        } catch(e) { 
          rec = new MediaRecorder(combinedStream); 
        }

        const chunks = [];
        rec.ondataavailable = (e) => { 
          if (e.data.size > 0) chunks.push(e.data); 
        };
        rec.onstop = () => {
          const finalBlob = new Blob(chunks, { type: 'video/mp4' });
          resolve(URL.createObjectURL(finalBlob));
        };

        rec.start();
        await vid.play();

        const vw = vid.videoWidth || 640;
        const vh = vid.videoHeight || 360;
        const targetRatio = 540 / 960;
        const sh = vh;
        const sw = vh * targetRatio;

        let isRecording = true;
        const renderLoop = async () => {
          if (!isRecording) return;
          if (!vid.paused && !vid.ended) {
            frameCounter++;
            if (poseDetector && frameCounter % 6 === 0) {
              try {
                await poseDetector.send({ image: vid });
              } catch (e) {}
            }

            smoothedTargetX += (currentTargetX - smoothedTargetX) * 0.15;

            let personCenterX = smoothedTargetX * vw;
            let sx = personCenterX - (sw / 2);

            if (sx < 0) sx = 0;
            if (sx + sw > vw) sx = vw - sw;

            ctx.drawImage(vid, sx, 0, sw, sh, 0, 0, 540, 960);
          }
          requestAnimationFrame(renderLoop);
        };
        requestAnimationFrame(renderLoop);

        // EXACT 30 SECONDS RECORDING
        setTimeout(() => {
          isRecording = false;
          if (rec.state === 'recording') rec.stop();
          vid.pause();
        }, CLIP_DURATION * 1000);
      });
    }

    // MAIN TIMELINE SHORTS EXECUTION (NO POPUPS, STATUS IN UI)
    window.sliceTimelineShorts = async () => {
      if (!selectedRawVideo) {
        alert("Pehle MP4 video upload karein!");
        return;
      }

      const TOTAL_CLIPS = parseInt(document.getElementById('shortsCountSelect').value) || 5;
      const rangeSpan = Math.max(30, trimEndSec - trimStartSec);
      const step = rangeSpan / TOTAL_CLIPS;

      const btn = document.getElementById('generateClipsBtn');
      btn.disabled = true;

      try {
        const generatedShorts = [];

        for (let i = 1; i <= TOTAL_CLIPS; i++) {
          const currentStart = trimStartSec + (i - 1) * step;
          btn.innerHTML = `<span>🎯 Body Tracking &amp; Audio Slicing Clip ${i} of ${TOTAL_CLIPS}...</span>`;
          const blobUrl = await sliceDirectVideoSegment(selectedRawVideo, i, currentStart);
          generatedShorts.push({
            url: blobUrl,
            timeLabel: `${Math.floor(currentStart / 60)}:${Math.floor(currentStart % 60).toString().padStart(2, '0')} - ${Math.floor((currentStart + 30) / 60)}:${Math.floor((currentStart + 30) % 60).toString().padStart(2, '0')}`
          });
        }

        const gallery = document.getElementById('clipsGalleryArea');
        gallery.className = "space-y-3 max-h-[500px] overflow-y-auto pr-1 text-left w-full";
        gallery.innerHTML = '';

        generatedShorts.forEach((item, index) => {
          const div = document.createElement('div');
          div.className = "p-3 bg-[#181820] border border-[rgba(226,192,114,0.2)] rounded-2xl flex items-center justify-between gap-3";
          div.innerHTML = `
            <div class="flex items-center gap-3 min-w-0">
              <video src="${item.url}" class="w-12 h-20 rounded-xl object-cover bg-black shadow-sm shrink-0" autoplay loop muted playsinline></video>
              <div class="min-w-0">
                <p class="font-black text-white text-xs truncate">Short Clip #${index + 1}</p>
                <p class="text-[10px] text-[#e2c072] font-bold truncate mt-0.5">30s Clip • ${item.timeLabel}</p>
                <p class="text-[9px] text-slate-400 mt-0.5">Vertical 9:16 • Tracked &amp; Audio</p>
              </div>
            </div>
            <a href="${item.url}" download="Short_Clip_${index + 1}.mp4" class="px-3.5 py-2 bg-gradient-to-r from-[#e2c072] to-[#c5a059] text-[#070707] hover:brightness-110 rounded-xl text-xs font-bold shrink-0 transition text-center cursor-pointer">
              Download
            </a>
          `;
          gallery.appendChild(div);
        });

        btn.disabled = false;
        btn.innerHTML = `<span>⚡ Generate AI Shorts (Cost: 10 Credits)</span>`;
      } catch (err) {
        console.error(err);
        btn.disabled = false;
        btn.innerHTML = `<span>⚡ Generate AI Shorts (Cost: 10 Credits)</span>`;
        alert("Processing me issue aaya, dobara koshish karein!");
      }
    };

                  <span class="text-slate-400 font-normal">${eduYear}</span>
                </div>
                <p class="text-[9.5px] font-medium text-slate-600">${eduCollege} (${eduGrade})</p>
              </div>
              <div>
                <h4 class="text-[10.5px] font-bold uppercase mb-1 pb-0.5 border-b border-slate-200" style="color: ${color}">Projects</h4>
                <p class="text-[9px] text-slate-600 leading-relaxed">${projects} | ${certifications}</p>
              </div>
            </div>
          </div>
        </div>
      `;
    };

    renderResumePreview();
  </script>
</body>
