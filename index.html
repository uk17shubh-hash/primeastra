<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrimeAstra - Fast Digital Tools. Zero Friction.</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #06080F;
      color: #F8FAFC;
    }
    .neon-glow {
      box-shadow: 0 0 25px -5px rgba(6, 182, 212, 0.4);
    }
    .grid-bg {
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 60% 50% at 50% 50%, #000 70%, transparent 100%);
    }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden antialiased selection:bg-cyan-500 selection:text-black">

  <!-- Background Grid Effect -->
  <div class="fixed inset-0 grid-bg pointer-events-none z-0"></div>

  <!-- Ambient Light Gradients -->
  <div class="fixed top-0 left-1/2 -translate-x-1/2 w-[700px] h-[350px] bg-gradient-to-tr from-cyan-500/15 via-indigo-500/10 to-transparent blur-[120px] pointer-events-none z-0"></div>

  <!-- ==========================================
       MAIN NAVIGATION HEADER
       ========================================== -->
  <header class="w-full relative z-50 border-b border-white/10 bg-[#06080F]/80 backdrop-blur-xl">
    <div class="max-w-7xl mx-auto px-5 py-4 flex items-center justify-between">
      
      <!-- Logo -->
      <a href="/" class="flex items-center gap-3">
        <svg class="w-9 h-9 drop-shadow-[0_0_10px_rgba(6,182,212,0.6)]" viewBox="0 0 500 500" fill="none">
          <defs>
            <linearGradient id="paGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f2fe" />
              <stop offset="50%" stop-color="#8b5cf6" />
              <stop offset="100%" stop-color="#6d28d9" />
            </linearGradient>
            <linearGradient id="paStarLight" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="60%" stop-color="#a78bfa" />
              <stop offset="100%" stop-color="#7c3aed" />
            </linearGradient>
          </defs>
          <path d="M250 18 Q250 65 285 65 Q250 65 250 112 Q250 65 215 65 Q250 65 250 18 Z" fill="url(#paStarLight)" />
          <path d="M220 85 C135 95 105 140 105 220 C105 330 175 425 250 480 C180 415 140 315 140 220 C140 160 160 125 220 105 Z" fill="url(#paGradLight)" />
          <path d="M280 85 C310 92 340 108 355 125 L328 148 C315 135 295 120 280 115 Z" fill="url(#paGradLight)" />
          <path d="M250 480 C290 435 345 375 370 300 L335 280 C315 340 275 395 250 435 Z" fill="url(#paGradLight)" />
          <path d="M135 430 C145 320 215 255 270 220 C320 185 350 125 370 55 L395 130 C370 180 335 225 285 260 C220 310 165 365 135 430 Z" fill="url(#paGradLight)" />
          <polygon points="380,55 305,108 335,122 360,170" fill="url(#paStarLight)" />
          <polygon points="380,55 335,122 360,170" fill="#6d28d9" />
          <path d="M250 140 L165 335 L200 335 L250 205 L275 270 L305 270 Z" fill="url(#paGradLight)" />
        </svg>
        <span class="text-xl font-extrabold tracking-tight text-white">
          Prime<span class="text-cyan-400">Astra</span>
        </span>
      </a>

      <!-- Desktop Links: About Us & Contact Us -->
      <nav class="hidden md:flex items-center gap-1 bg-white/5 border border-white/10 px-5 py-2 rounded-full text-xs font-semibold text-slate-300">
        <a href="#about" class="px-3 py-1 hover:text-white transition">About Us</a>
        <a href="#contact" class="px-3 py-1 hover:text-white transition">Contact Us</a>
      </nav>

      <!-- Desktop Right Auth (Start Your Work ki jagah Login / Register) -->
      <div id="desktopAuthContainer" class="hidden md:flex items-center gap-3">
        <button id="desktopLoginBtn" class="px-5 py-2.5 rounded-full text-xs font-bold text-white bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 shadow-md hover:shadow-cyan-500/20 transition cursor-pointer">
          Login / Register
        </button>
      </div>

      <!-- Mobile Hamburger Button -->
      <button id="mobileMenuToggle" class="md:hidden p-2 text-slate-300 hover:text-white focus:outline-none">
        <svg id="menuIcon" class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16m-7 6h7"></path>
        </svg>
      </button>

    </div>
  </header>

  <!-- ==========================================
       MOBILE DRAWER MENU (Phone View)
       ========================================== -->
  <div id="mobileDrawer" class="hidden md:hidden fixed inset-x-0 top-[69px] z-40 bg-[#080B14]/95 backdrop-blur-2xl border-b border-white/10 p-6 flex flex-col gap-4 text-left shadow-2xl transition-all">
    
    <!-- 1. Phone View Auth Section (Sabse Upar) -->
    <div id="mobileAuthContainer" class="w-full">
      <button id="mobileLoginBtn" class="w-full py-3 text-center text-xs font-bold text-white bg-gradient-to-r from-purple-600 to-indigo-600 rounded-2xl shadow-md cursor-pointer flex items-center justify-center gap-2">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
        <span>Login / Register</span>
      </button>
    </div>

    <!-- 2. Phone View Links (About Us & Contact Us) -->
    <div class="flex flex-col gap-3 text-sm font-semibold text-slate-300 border-t border-white/10 pt-4">
      <a href="#about" class="py-1 hover:text-cyan-400 transition">About Us</a>
      <a href="#contact" class="py-1 hover:text-cyan-400 transition">Contact Us</a>
    </div>

  </div>

  <!-- ==========================================
       HERO LANDING SECTION
       ========================================== -->
  <main class="relative z-10 max-w-5xl mx-auto px-5 pt-20 pb-28 text-center flex flex-col items-center">
    
    <div class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full border border-cyan-400/30 bg-cyan-400/10 text-cyan-300 text-xs font-semibold mb-8">
      <span class="w-2 h-2 rounded-full bg-cyan-400 animate-pulse"></span>
      NEXT-GEN SMART UTILITY &amp; CREATIONS HUB
    </div>

    <h1 class="text-4xl sm:text-6xl md:text-7xl font-extrabold tracking-tight leading-[1.1] mb-6">
      FAST DIGITAL TOOLS.<br>
      <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-300 to-purple-500">
        ZERO FRICTION.
      </span>
    </h1>

    <p class="max-w-2xl text-slate-400 text-sm sm:text-base leading-relaxed mb-10">
      PrimeAstra brings lightning-fast utilities, developer tools, and digital portfolio creations together into one fluid space.
    </p>

    <!-- Global Tool Search Input -->
    <div class="w-full max-w-xl relative mb-8">
      <input
        type="text"
        placeholder="Search any tool (e.g., Image Compressor, PDF, Code, Resume Maker)..."
        class="w-full px-5 py-3.5 pl-12 bg-white/[0.04] border border-white/10 rounded-2xl text-xs sm:text-sm font-medium text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400/60 focus:ring-2 focus:ring-cyan-400/20 transition shadow-inner"
      />
      <svg class="w-4 h-4 text-slate-500 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </div>

    <!-- CTA Action Buttons -->
    <div class="flex flex-wrap items-center justify-center gap-4">
      <a
        href="./app.html"
        class="px-7 py-3 rounded-full bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-slate-950 font-bold text-xs sm:text-sm shadow-lg shadow-cyan-500/25 transition cursor-pointer flex items-center gap-2"
      >
        <span>Launch App Workspace</span>
        <span>&rarr;</span>
      </a>
      <a
        href="#about"
        class="px-6 py-3 rounded-full bg-white/5 border border-white/10 hover:bg-white/10 text-white font-semibold text-xs sm:text-sm transition"
      >
        About Us
      </a>
    </div>

  </main>

  <!-- ==========================================
       FIREBASE AUTHENTICATION SCRIPT (Google & Gmail Photo)
       ========================================== -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      GoogleAuthProvider, 
      signInWithPopup, 
      onAuthStateChanged, 
      signOut 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      setDoc, 
      getDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyA4mMH0LMAvN_vuCLCdYR3tGZHdmbq7iMM",
      authDomain: "primeastra-643ac.firebaseapp.com",
      projectId: "primeastra-643ac",
      storageBucket: "primeastra-643ac.firebasestorage.app",
      messagingSenderId: "756871848434",
      appId: "1:756871848434:web:07c5220d2a84a026190b6b",
      measurementId: "G-R8H0S5LW8N"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    // DOM Elements
    const desktopAuthContainer = document.getElementById("desktopAuthContainer");
    const mobileAuthContainer = document.getElementById("mobileAuthContainer");
    const mobileDrawer = document.getElementById("mobileDrawer");
    const mobileMenuToggle = document.getElementById("mobileMenuToggle");

    // Toggle Mobile Drawer
    mobileMenuToggle.addEventListener("click", () => {
      mobileDrawer.classList.toggle("hidden");
    });

    // Google Sign In Handler
    const handleGoogleAuth = async () => {
      try {
        const result = await signInWithPopup(auth, provider);
        const user = result.user;

        // Firestore mein entry save karna
        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (!userSnap.exists()) {
          await setDoc(userRef, {
            uid: user.uid,
            name: user.displayName || "User",
            email: user.email,
            photoUrl: user.photoURL || "",
            createdAt: new Date().toISOString()
          });
        }
      } catch (err) {
        console.error("Authentication Error:", err);
        alert("Login failed: " + err.message);
      }
    };

    // Logout Handler
    window.handleLogout = () => {
      signOut(auth);
    };

    // Auth State Listener (Syncs Desktop & Mobile view automatically)
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User Login Hai: Google / Gmail Photo ya initial avatar
        const photo = user.photoURL || `https://ui-avatars.com/api/?name=${encodeURIComponent(user.displayName || user.email || 'U')}&background=6366f1&color=fff&bold=true`;
        const name = user.displayName || user.email.split('@')[0];

        // 1. Desktop Profile View
        desktopAuthContainer.innerHTML = `
          <div class="flex items-center gap-3 bg-white/5 border border-white/10 p-1.5 pr-4 rounded-full">
            <img src="${photo}" alt="Profile" class="w-8 h-8 rounded-full border border-cyan-400 object-cover" />
            <span class="text-xs font-semibold text-white truncate max-w-[120px]">${name}</span>
            <button onclick="handleLogout()" class="text-[11px] font-bold text-rose-400 hover:text-rose-300 ml-1 transition cursor-pointer">
              Logout
            </button>
          </div>
        `;

        // 2. Mobile Drawer Profile View
        mobileAuthContainer.innerHTML = `
          <div class="p-3 bg-white/5 border border-white/10 rounded-2xl flex items-center justify-between">
            <div class="flex items-center gap-3">
              <img src="${photo}" alt="Profile" class="w-9 h-9 rounded-full border border-cyan-400 object-cover" />
              <div class="overflow-hidden">
                <p class="text-xs font-bold text-white truncate max-w-[150px]">${name}</p>
                <p class="text-[10px] text-slate-400 truncate max-w-[150px]">${user.email}</p>
              </div>
            </div>
            <button onclick="handleLogout()" class="px-3 py-1.5 text-xs font-bold text-rose-400 bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/20 rounded-xl transition cursor-pointer">
              Logout
            </button>
          </div>
        `;
      } else {
        // User Logout Hai: "Login / Register" Button
        const loginBtnHTML = `
          <button id="loginActionBtn" class="w-full md:w-auto px-5 py-2.5 rounded-full text-xs font-bold text-white bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 shadow-md transition cursor-pointer flex items-center justify-center gap-2">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
            <span>Login / Register</span>
          </button>
        `;

        desktopAuthContainer.innerHTML = loginBtnHTML;
        mobileAuthContainer.innerHTML = loginBtnHTML;

        // Button Event Listeners
        document.querySelectorAll("#loginActionBtn").forEach(btn => {
          btn.addEventListener("click", handleGoogleAuth);
        });
      }
    });
  </script>

</body>
</html>
